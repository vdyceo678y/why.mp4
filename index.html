<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAY V1D FULL - Premium Player</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0f0f12;
            --secondary-bg: #1a1b22;
            --accent-color: #ffd900;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2d2e37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: var(--secondary-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        /* Main Container */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .video-wrapper {
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        video {
            width: 100%;
            display: block;
            outline: none;
        }

        /* Iklan Area */
        .ad-space {
            margin-top: 20px;
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        /* Footer */
        footer {
            background: var(--secondary-bg);
            padding: 15px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }

        /* Utility */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="no-select">

    <header>
        <h1>V1D PLAYER</h1>
    </header>

    <div class="main-content">
        <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            
            <!-- Area Iklan Atas -->
            <script async="async" data-cfasync="false" src="https://hypothesisgarden.com/c41a23ff90a4cb9a439bd54b5d951bc3/invoke.js"></script>
<div id="container-c41a23ff90a4cb9a439bd54b5d951bc3"></div>


            <!-- Video Player -->
            <div class="video-wrapper">
                <video 
                    controls 
                    autoplay 
                    playsinline 
                    controlslist="nodownload noremoteplayback" 
                    disablepictureinpicture 
                    preload="auto">
                    <source src="https://cdn2.videy.co/BSki31d61.mp4" type="video/mp4">
                    Browser Anda tidak mendukung pemutar video.
                </video>
            </div>

            <!-- Area Iklan Bawah -->
            <div class="ad-space">
                <p style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px;">ADVERTISEMENT</p>
                <!-- Script iklan Anda bisa ditaruh di sini -->
            </div>
        </div>
    </div>


    <script>
        // Keamanan: Proteksi Klik Kanan & Inspeksi
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        document.addEventListener('keydown', e => {
            if (
                e.key === "F12" || 
                (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) || 
                (e.ctrlKey && (e.key === "U" || e.key === "S"))
            ) {
                e.preventDefault();
            }
        });

        // Mencegah Fullscreen jika diinginkan (opsional)
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                // Hapus baris di bawah jika Anda ingin mengizinkan fullscreen
                // document.exitFullscreen(); 
            }
        });
    </script>

  
</body>
</html>
